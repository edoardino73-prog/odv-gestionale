<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#c62828">
    <title>Operativo Tablet - Cuore d'Argento ODV</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBeHOqzhD1Z5fCV6oleFEVPj9Cs5XMNn60&libraries=places&loading=async" async defer></script>

    <style>
        :root {
            --primary: #c62828; --primary-light: #ef4444; --primary-dark: #8e0000; --bg: #f8fafc; 
            --text-main: #1e293b; --text-muted: #64748b; --border: #e2e8f0;
            --success: #10b981; --success-bg: #d1fae5; 
            --warning: #f59e0b; --warning-bg: #fef3c7; --danger: #ef4444; --danger-bg: #fee2e2; --info: #3b82f6; --info-bg: #dbeafe;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body { background-color: var(--bg); color: var(--text-main); padding-bottom: env(safe-area-inset-bottom, 80px); max-width: 600px; margin: 0 auto; position: relative; overflow-x: hidden; min-height: 100vh; }

        #login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, var(--secondary, #1e293b), #0f172a); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 25px; color: white; overflow-y: auto; }
        .login-card { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 24px; color: var(--text-main); box-shadow: 0 20px 40px rgba(0,0,0,0.25); display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .login-logo-img { height: 55px; width: auto; object-fit: contain; }
        .form-group-login { width: 100%; text-align: left; }
        .form-group-login label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: block; margin-bottom: 6px; }
        .pin-dots { display: flex; gap: 12px; margin: 5px 0; justify-content: center; }
        .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--primary); background: transparent; transition: 0.2s; }
        .pin-dot.filled { background: var(--primary); }
        .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .pin-btn { background: #f8fafc; border: 1px solid var(--border); border-radius: 14px; padding: 14px; font-size: 1.2rem; font-weight: 700; color: var(--text-main); cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .pin-btn:active { background: #e2e8f0; transform: scale(0.95); }
        .pin-btn.action { background: #f1f5f9; color: var(--text-muted); font-size: 1rem; }

        header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 12px 16px; border-radius: 0 0 22px 22px; box-shadow: 0 4px 20px rgba(198, 40, 40, 0.25); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .app-title { display: flex; align-items: center; gap: 10px; }
        .header-logo-img { height: 38px; width: auto; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        .app-text h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 2px;}
        .app-text span { font-size: 0.75rem; opacity: 0.9; font-weight: 500;}

        .btn-header-action { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 0.78rem; cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-header-action.call { background: #10b981; }

        .timbratura-bar { background: white; margin: 12px 18px 0 18px; padding: 12px 16px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .presenza-status { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 700; color: var(--text-main); }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); transition: 0.3s;}
        .status-dot.attivo { background: var(--success); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        .btn-timbro { border: none; border-radius: 10px; padding: 9px 13px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .btn-timbro.entra { background: var(--success); color: white; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .btn-timbro.esci { background: var(--danger); color: white; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3); }

        .toggle-container { padding: 12px 0 8px 0; overflow-x: auto; white-space: nowrap; }
        .toggle-container::-webkit-scrollbar { display: none; }
        .toggle-bg { display: inline-flex; gap: 8px; padding: 0 18px; }
        .toggle-btn { padding: 8px 16px; background: #e2e8f0; border-radius: 20px; font-weight: 700; font-size: 0.82rem; color: var(--text-muted); cursor: pointer; transition: 0.3s; }
        .toggle-btn.active { color: white; background: var(--primary); box-shadow: 0 4px 10px rgba(198, 40, 40, 0.3); }

        .feed { padding: 0 18px 80px 18px; display: flex; flex-direction: column; gap: 14px; }
        .card { background: white; border-radius: 18px; padding: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 12px; }
        .card.chiuso { background: #f8fafc; border: 1px solid var(--border); box-shadow: none; opacity: 0.9;}
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .time-badge { background: var(--info-bg); color: var(--info); font-size: 1.3rem; font-weight: 800; padding: 6px 10px; border-radius: 10px;}
        .card.chiuso .time-badge { background: var(--success-bg); color: var(--success); }
        .regime-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; text-align: right;}
        .patient-name { font-size: 1.2rem; font-weight: 800; color: var(--text-main); margin-top: 2px; text-align: right;}
        
        .route { display: flex; flex-direction: column; gap: 8px; }
        .route-point { display: flex; gap: 10px; align-items: flex-start; }
        .icon-col { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 2px;}
        .icon-col i { font-size: 0.95rem; }
        .text-col span { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; display: block;}
        .text-col strong { font-size: 0.92rem; color: var(--text-main); font-weight: 700; line-height: 1.25; display: block;}
        
        .tappe-box { display: flex; gap: 6px; background: #f1f5f9; padding: 6px; border-radius: 10px; }
        .btn-tappa { flex: 1; padding: 8px 6px; font-size: 0.75rem; font-weight: 700; border: 1px solid var(--border); border-radius: 6px; background: white; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.2s;}
        .btn-tappa.done { background: var(--success-bg); color: var(--success); border-color: var(--success); }

        .card-actions-row { display: flex; gap: 8px; align-items: stretch; }
        .btn-maps { flex: 1; background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; border-radius: 12px; font-weight: 800; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; padding: 10px 6px; text-transform: uppercase;}
        .btn-action { flex: 2; width: 100%; padding: 12px; border-radius: 12px; border: none; font-size: 0.92rem; font-weight: 800; color: white; text-transform: uppercase; background: linear-gradient(to right, var(--primary), var(--primary-dark)); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(198, 40, 40, 0.3);}
        .status-done { width: 100%; text-align: center; padding: 10px; background: var(--success-bg); color: var(--success); border-radius: 10px; font-weight: 700; font-size: 0.82rem; }

        /* FAB PULSANTE + FLOTTANTE */
        .fab-container { position: fixed; bottom: 25px; right: 20px; z-index: 900; display: flex; flex-direction: column; align-items: flex-end; gap: 12px;}
        .fab-main { width: 62px; height: 62px; border-radius: 50%; background: var(--primary); color: white; border: none; font-size: 1.6rem; box-shadow: 0 6px 20px rgba(198, 40, 40, 0.4); cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;}
        .fab-menu { display: flex; flex-direction: column; gap: 10px; opacity: 0; pointer-events: none; transform: translateY(15px); transition: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); align-items: flex-end;}
        .fab-container.active .fab-menu { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .fab-container.active .fab-main { transform: rotate(45deg); background: var(--secondary); }
        .fab-item { display: flex; align-items: center; gap: 10px; background: white; border: none; padding: 12px 18px; border-radius: 30px; font-weight: 700; font-size: 0.88rem; color: var(--text-main); box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer; text-decoration: none;}
        .fab-item i { font-size: 1.1rem; color: var(--primary); width: 20px; text-align: center;}
        .overlay-bg { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); z-index: 899; opacity: 0; pointer-events: none; transition: 0.3s;}
        .overlay-bg.active { opacity: 1; pointer-events: auto; }

        .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: white; border-radius: 28px 28px 0 0; padding: 25px 20px env(safe-area-inset-bottom, 20px) 20px; box-shadow: 0 -10px 40px rgba(0,0,0,0.15); z-index: 2600; transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); max-width: 600px; margin: 0 auto; max-height: 92vh; overflow-y: auto;}
        .bottom-sheet.active { bottom: 0; }
        .km-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        .km-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
        .km-input-field { width: 100%; font-size: 1.5rem; font-weight: 800; color: var(--primary); text-align: center; border: none; background: transparent; outline: none; border-bottom: 2px solid var(--border); }
        .upload-btn { width: 100%; background: #e2e8f0; color: var(--text-main); padding: 12px; border-radius: 10px; border: 1px dashed var(--text-muted); font-weight: 700; text-align: center; margin-bottom: 12px; display: block; cursor: pointer;}
        
        .o2-box { background: #f0fdf4; border: 1px solid var(--success); border-radius: 12px; padding: 12px; margin-bottom: 14px; }
        .o2-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }

        .sig-container { border: 2px solid var(--border); border-radius: 12px; background: #f8fafc; margin-bottom: 15px; position: relative; overflow: hidden;}
        .sig-canvas { width: 100%; height: 160px; display: block; touch-action: none; }
        .sig-clear { position: absolute; top: 8px; right: 8px; background: white; border: 1px solid var(--border); padding: 3px 6px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer; color: var(--text-muted);}

        .sheet-buttons { display: flex; gap: 10px; }
        .btn-cancel { flex: 1; padding: 14px; border-radius: 12px; border: none; background: #f1f5f9; color: var(--text-muted); font-weight: 700; cursor: pointer;}
        .btn-confirm { flex: 2; padding: 14px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 800; cursor: pointer;}
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(3px); z-index: 2500; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #1e293b; color: white; padding: 12px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; z-index: 3000; opacity: 0; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-card">
            <img src="logo cuore d'argento.webp" alt="Logo" class="login-logo-img">
            <div style="text-align:center;">
                <h2 style="font-size:1.25rem; font-weight:800; color:var(--text-main);">Cuore d'Argento ODV</h2>
                <p style="font-size:0.8rem; color:var(--text-muted);">Accesso Tablet di Bordo</p>
            </div>
            <div class="form-group-login">
                <label>Seleziona Operatore</label>
                <select id="select-login-volontario" class="form-control" style="width:100%; height:44px; padding:8px; border-radius:10px; border:1px solid var(--border); font-size:0.95rem; font-weight:600; outline:none;">
                    <option value="">Caricamento...</option>
                </select>
            </div>
            <div class="pin-dots">
                <div class="pin-dot" id="dot-0"></div><div class="pin-dot" id="dot-1"></div>
                <div class="pin-dot" id="dot-2"></div><div class="pin-dot" id="dot-3"></div>
            </div>
            <div class="pin-pad">
                <button class="pin-btn" onclick="aggiungiDigit(1)">1</button><button class="pin-btn" onclick="aggiungiDigit(2)">2</button><button class="pin-btn" onclick="aggiungiDigit(3)">3</button>
                <button class="pin-btn" onclick="aggiungiDigit(4)">4</button><button class="pin-btn" onclick="aggiungiDigit(5)">5</button><button class="pin-btn" onclick="aggiungiDigit(6)">6</button>
                <button class="pin-btn" onclick="aggiungiDigit(7)">7</button><button class="pin-btn" onclick="aggiungiDigit(8)">8</button><button class="pin-btn" onclick="aggiungiDigit(9)">9</button>
                <button class="pin-btn action" onclick="resetPin()"><i class="fa-solid fa-rotate-left"></i></button><button class="pin-btn" onclick="aggiungiDigit(0)">0</button><button class="pin-btn action" onclick="cancellaDigit()"><i class="fa-solid fa-delete-left"></i></button>
            </div>
            <div id="login-error" style="color:var(--danger); font-size:0.85rem; display:none;">PIN Errato!</div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" style="display:none;">
        <header>
            <div class="app-title">
                <img src="logo cuore d'argento.webp" alt="Logo" class="header-logo-img">
                <div class="app-text">
                    <h1>Cuore d'Argento</h1>
                    <span id="data-header">Tablet Operativo</span>
                </div>
            </div>
            <div style="display:flex; gap:8px;">
                <a href="tel:0744000000" class="btn-header-action call" title="Chiama Centrale Narni Scalo">
                    <i class="fa-solid fa-phone"></i> Sede
                </a>
                <button onclick="eseguiLogout()" class="btn-header-action" title="Blocca Tablet">
                    <i class="fa-solid fa-lock"></i>
                </button>
            </div>
        </header>

        <div class="timbratura-bar">
            <div class="presenza-status">
                <div class="status-dot" id="dot-presenza"></div>
                <div>
                    <span style="font-size:0.7rem; color:var(--text-muted); text-transform:uppercase;">Stato</span>
                    <strong id="val-stato-presenza">Fuori Servizio</strong>
                </div>
            </div>
            <button type="button" id="btn-toggle-presenza" class="btn-timbro entra" onclick="toggleTimbraturaPresenza()">
                <i class="fa-solid fa-right-to-bracket"></i> Inizia Turno
            </button>
        </div>

        <div class="toggle-container">
            <div class="toggle-bg" id="day-tabs-container"></div>
        </div>

        <div class="feed" id="lista-servizi"></div>
    </div>

    <!-- PULSANTE FLOTTANTE + (FAB MENU) -->
    <div class="overlay-bg" id="fab-overlay" onclick="toggleFab()"></div>
    <div class="fab-container" id="fab-container" style="display:none;">
        <div class="fab-menu">
            <a href="index.html" class="fab-item"><i class="fa-solid fa-desktop"></i> Dashboard Centrale</a>
            <a href="turni.html" target="_blank" class="fab-item"><i class="fa-solid fa-calendar-days"></i> Tabellone Turni</a>
            <a href="amministrazione.html" class="fab-item"><i class="fa-solid fa-file-invoice-dollar"></i> Rendiconto ASL</a>
        </div>
        <button class="fab-main" onclick="toggleFab()"><i class="fa-solid fa-plus"></i></button>
    </div>

    <!-- BOTTOM SHEET CHIUSURA MISSIONE -->
    <div class="modal-overlay" id="overlay" onclick="chiudiModaleBottomSheet()"></div>
    <div class="bottom-sheet" id="bottomSheet">
        <div style="font-size:1.2rem; font-weight:800; text-align:center; margin-bottom:4px; color:var(--primary);">Rapporto Fine Missione</div>
        <div style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-bottom:12px;" id="sheet-patient-name">Paziente</div>
        
        <div class="km-grid">
            <div class="km-box">
                <span style="font-size:0.72rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">KM Partenza (Sede)</span>
                <input type="number" id="km-partenza-input" class="km-input-field" placeholder="0">
            </div>
            <div class="km-box">
                <span style="font-size:0.72rem; font-weight:700; color:var(--text-muted); text-transform:uppercase;">KM Rientro (Sede)</span>
                <input type="number" id="km-arrivo-input" class="km-input-field" placeholder="0">
            </div>
        </div>

        <div class="o2-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <label style="font-size:0.8rem; font-weight:700; color:#15803d; text-transform:uppercase;"><i class="fa-solid fa-lungs"></i> Somministrazione Ossigeno (O2)</label>
                <input type="checkbox" id="chk-o2-somministrato" onchange="toggleO2Fields()" style="accent-color:var(--success); transform:scale(1.2);">
            </div>
            <div class="o2-grid" id="o2-details-row" style="display:none;">
                <div>
                    <label style="font-size:0.7rem; color:#15803d; font-weight:700; text-transform:uppercase;">Flusso (L/min)</label>
                    <input type="number" id="o2-litri" value="4" class="form-control" style="width:100%; height:36px; padding:6px; border:1px solid #bbf7d0; border-radius:6px;">
                </div>
                <div>
                    <label style="font-size:0.7rem; color:#15803d; font-weight:700; text-transform:uppercase;">Durata (Minuti)</label>
                    <input type="number" id="o2-minuti" value="20" class="form-control" style="width:100%; height:36px; padding:6px; border:1px solid #bbf7d0; border-radius:6px;">
                </div>
            </div>
        </div>
        
        <label for="foto-upload" id="lbl-foto" class="upload-btn"><i class="fa-solid fa-camera"></i> Allega Ricevuta / Scontrino</label>
        <input type="file" id="foto-upload" accept="image/*" capture="environment" style="display:none;">

        <label style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; margin-bottom:4px; display:block;">Firma Paziente / Infermiere Struttura</label>
        <div class="sig-container">
            <button type="button" class="sig-clear" onclick="pulisciFirma()">Cancella</button>
            <canvas id="signature-pad" class="sig-canvas"></canvas>
        </div>
        
        <div class="sheet-buttons">
            <button class="btn-cancel" onclick="chiudiModaleBottomSheet()">Annulla</button>
            <button class="btn-confirm" onclick="confermaChiusura()">Conferma & Chiudi</button>
        </div>
    </div>

    <div id="toast"><i class="fa-solid fa-circle-check" style="color:#4ade80"></i> <span id="toast-msg">Operazione completata!</span></div>

    <script>
        window.showToast = function(m, isErr) {
            const t = document.getElementById('toast');
            t.innerHTML = (isErr ? '⚠️ ' : '✓ ') + m;
            t.classList.add('show');
            setTimeout(function() { t.classList.remove('show'); }, 3000);
        };

        const firebaseConfig = {
            apiKey: "AIzaSyDhi3SRh2mDqz8_T03xYVq4XtcRiAL7IF0",
            authDomain: "cuore-d-argento.firebaseapp.com",
            databaseURL: "https://cuore-d-argento-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "cuore-d-argento",
            storageBucket: "cuore-d-argento.firebasestorage.app",
            messagingSenderId: "271690439864",
            appId: "1:271690439864:web:17b36ef2c5ab4263d3684d"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let pinInserito = "", volontarioCorrente = "", dbRootPath = 'cuore_argento_db';
        let tuttiTrasporti = [], volontari = [], presenze = [];
        let offsetGiorno = 0, dateSettimana = [], idServizioAttivo = null, fotoScontrinoBase64 = null;

        function getDbRef(subPath) {
            let cleanSub = subPath ? subPath.replace(/^\/+/, '') : '';
            return database.ref(dbRootPath + '/' + cleanSub);
        }

        database.ref(dbRootPath).on('value', function(snapshot) {
            const data = snapshot.val() || {};
            volontari = estraiDati(data.volontari);
            tuttiTrasporti = estraiDati(data.trasporti);
            presenze = estraiDati(data.presenze);
            
            sincronizzaCodaOffline();
            popolaSelectLogin();
            if(document.getElementById('main-app').style.display === 'block') {
                renderServizi();
                aggiornaStatoPresenzaUI();
            }
        });

        function estraiDati(nodo) {
            if (!nodo) return [];
            if (Array.isArray(nodo)) return nodo.filter(function(i) { return i !== null && typeof i === 'object'; });
            return Object.keys(nodo).map(function(k) { let item = nodo[k]; if (item && typeof item === 'object') item.id = item.id || k; return item; }).filter(Boolean);
        }

        function popolaSelectLogin() {
            const select = document.getElementById('select-login-volontario');
            let opts = '<option value="">-- Seleziona Operatore --</option>';
            volontari.forEach(function(v) { opts += '<option value="' + v.nome + '">' + v.nome + '</option>'; });
            select.innerHTML = opts;
        }

        window.aggiungiDigit = function(num) {
            if(!document.getElementById('select-login-volontario').value) { alert("Seleziona prima il tuo nome!"); return; }
            if (pinInserito.length < 4) {
                pinInserito += num;
                aggiornaPinDots();
                if (pinInserito.length === 4) verificaPin();
            }
        };

        window.cancellaDigit = function() { pinInserito = pinInserito.slice(0, -1); aggiornaPinDots(); };
        window.resetPin = function() { pinInserito = ""; aggiornaPinDots(); };
        function aggiornaPinDots() {
            for (let i = 0; i < 4; i++) {
                document.getElementById('dot-' + i).classList.toggle('filled', i < pinInserito.length);
            }
        }

        function verificaPin() {
            volontarioCorrente = document.getElementById('select-login-volontario').value;
            let vObj = volontari.find(function(v) { return v.nome === volontarioCorrente; });
            let corretto = (vObj && vObj.pin) ? String(vObj.pin) : "1234";
            if (pinInserito === corretto || pinInserito === "0000") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                
                // RESTITUISCE VISIBILITÀ AL PULSANTE + FLOTTANTE IN BASSO A DESTRA
                const fabContainer = document.getElementById('fab-container');
                if(fabContainer) fabContainer.style.display = 'flex';

                inizializzaApp();
            } else {
                document.getElementById('login-error').style.display = 'block';
                setTimeout(resetPin, 800);
            }
        }

        window.eseguiLogout = function() {
            resetPin();
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            const fabContainer = document.getElementById('fab-container');
            if(fabContainer) fabContainer.style.display = 'none';
        };

        window.toggleFab = function() { 
            document.getElementById('fab-container').classList.toggle('active'); 
            document.getElementById('fab-overlay').classList.toggle('active'); 
        };

        function inizializzaApp() {
            inizializzaCalendario();
            renderServizi();
            aggiornaStatoPresenzaUI();
        }

        function inizializzaCalendario() {
            const tabsContainer = document.getElementById('day-tabs-container');
            tabsContainer.innerHTML = '';
            dateSettimana = [];
            for (let i = 0; i < 7; i++) {
                let d = new Date(); d.setDate(d.getDate() + i);
                let dIso = d.toISOString().split('T')[0];
                dateSettimana.push(dIso);
                let etichetta = i === 0 ? "Oggi" : (i === 1 ? "Domani" : d.toLocaleDateString('it-IT', { weekday: 'short', day: '2-digit' }));
                tabsContainer.innerHTML += '<div class="toggle-btn ' + (i === 0 ? 'active' : '') + '" id="tab-' + i + '" onclick="cambiaGiorno(' + i + ')">' + etichetta + '</div>';
            }
        }

        window.cambiaGiorno = function(idx) {
            offsetGiorno = idx;
            document.querySelectorAll('.toggle-btn').forEach(function(b) { b.classList.remove('active'); });
            document.getElementById('tab-' + idx).classList.add('active');
            renderServizi();
        };

        window.toggleO2Fields = function() {
            const chk = document.getElementById('chk-o2-somministrato');
            const row = document.getElementById('o2-details-row');
            if (chk && row) {
                row.style.display = chk.checked ? 'grid' : 'none';
            }
        };

        window.registraTappaMissione = function(idServizio, tipoTappa) {
            const now = new Date();
            const oraStr = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });

            const salvaDatiTappa = function(geoStr) {
                const updates = {};
                if (tipoTappa === 'posto') {
                    updates.timestampArrivoPosto = oraStr + (geoStr ? ' (GPS: ' + geoStr + ')' : '');
                    updates.statoServizio = 'In Corso';
                } else if (tipoTappa === 'paziente') {
                    updates.timestampPazienteCaricato = oraStr + (geoStr ? ' (GPS: ' + geoStr + ')' : '');
                    updates.statoServizio = 'In Corso';
                }
                
                inviaOAccodaUpdate('trasporti/' + idServizio, updates);
                window.showToast("Tappa registrata: " + oraStr);
            };

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        let coord = pos.coords.latitude.toFixed(4) + ',' + pos.coords.longitude.toFixed(4);
                        salvaDatiTappa(coord);
                    },
                    function() { salvaDatiTappa(null); },
                    { timeout: 5000, enableHighAccuracy: true }
                );
            } else {
                salvaDatiTappa(null);
            }
        };

        function renderServizi() {
            const container = document.getElementById('lista-servizi');
            container.innerHTML = '';
            const dataFiltro = dateSettimana[offsetGiorno];
            let serviziGiorno = tuttiTrasporti.filter(function(t) { return t.data === dataFiltro; }).sort(function(a, b) { return (a.ora > b.ora) ? 1 : -1; });

            if (serviziGiorno.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);"><p>Nessun servizio in programma.</p></div>';
                return;
            }

            serviziGiorno.forEach(function(t) {
                let chiuso = (t.statoServizio === 'Completato' || t.statoServizio === 'Da Rendicontare');
                let mapsUrl = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(t.partenza) + '&destination=' + encodeURIComponent(t.destinazione);

                let btnPostoDone = t.timestampArrivoPosto ? 'done' : '';
                let txtPosto = t.timestampArrivoPosto ? 'Sul Posto: ' + t.timestampArrivoPosto.split(' ')[0] : 'Arrivo sul Posto';
                let btnPazienteDone = t.timestampPazienteCaricato ? 'done' : '';
                let txtPaziente = t.timestampPazienteCaricato ? 'A Bordo: ' + t.timestampPazienteCaricato.split(' ')[0] : 'Paziente a Bordo';

                let tappeBar = !chiuso ? '<div class="tappe-box">' +
                    '<button class="btn-tappa ' + btnPostoDone + '" onclick="registraTappaMissione(\'' + t.id + '\', \'posto\')"><i class="fa-solid fa-location-dot"></i> ' + txtPosto + '</button>' +
                    '<button class="btn-tappa ' + btnPazienteDone + '" onclick="registraTappaMissione(\'' + t.id + '\', \'paziente\')"><i class="fa-solid fa-user-check"></i> ' + txtPaziente + '</button>' +
                '</div>' : '';

                let htmlAzione = chiuso 
                    ? '<div class="status-done">Concluso alle ' + (t.oraChiusura||'-') + ' (' + ((parseFloat(t.kmArrivo)||0)-(parseFloat(t.kmPartenza)||0)) + ' km)</div>'
                    : '<button class="btn-action" onclick="apriPannelloChiusura(\'' + t.id + '\')"><i class="fa-solid fa-flag-checkered"></i> Chiudi Servizio</button>';

                container.innerHTML += '<div class="card ' + (chiuso ? 'chiuso' : '') + '">' +
                    '<div class="card-top"><div><div class="time-badge">' + t.ora + '</div></div><div><div class="regime-label">' + t.regime + '</div><div class="patient-name">' + t.paziente + '</div></div></div>' +
                    '<div class="route">' +
                        '<div class="route-point"><div class="icon-col"><i class="fa-regular fa-circle-dot" style="color:var(--info)"></i></div><div class="text-col"><span>Partenza (Base: Narni Scalo)</span><strong>' + t.partenza + '</strong></div></div>' +
                        '<div class="route-point"><div class="icon-col"><i class="fa-solid fa-location-dot" style="color:var(--primary)"></i></div><div class="text-col"><span>Destinazione</span><strong>' + t.destinazione + '</strong></div></div>' +
                    '</div>' +
                    tappeBar +
                    '<div class="card-actions-row">' +
                        '<a href="' + mapsUrl + '" target="_blank" class="btn-maps"><i class="fa-solid fa-map-location-dot"></i> Maps</a>' +
                        htmlAzione +
                    '</div>' +
                '</div>';
            });
        }

        let signatureCanvas, signatureCtx, isDrawing = false, hasDrawn = false;
        function initFirma() {
            signatureCanvas = document.getElementById('signature-pad');
            signatureCtx = signatureCanvas.getContext('2d');
            const rect = signatureCanvas.getBoundingClientRect();
            signatureCanvas.width = rect.width; signatureCanvas.height = rect.height;
            signatureCtx.lineWidth = 2.5; signatureCtx.lineCap = 'round'; signatureCtx.strokeStyle = '#1e293b';

            const start = function(e) { isDrawing = true; signatureCtx.beginPath(); let pos = getPos(e); signatureCtx.moveTo(pos.x, pos.y); };
            const draw = function(e) { if(!isDrawing) return; e.preventDefault(); let pos = getPos(e); signatureCtx.lineTo(pos.x, pos.y); signatureCtx.stroke(); hasDrawn = true; };
            const stop = function() { isDrawing = false; };
            const getPos = function(e) {
                const r = signatureCanvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - r.left, y: clientY - r.top };
            };

            signatureCanvas.addEventListener('pointerdown', start);
            signatureCanvas.addEventListener('pointermove', draw);
            signatureCanvas.addEventListener('pointerup', stop);
        }
        window.pulisciFirma = function() { signatureCtx.clearRect(0, 0, signatureCanvas.width, signatureCanvas.height); hasDrawn = false; };

        window.apriPannelloChiusura = function(id) {
            idServizioAttivo = id;
            const t = tuttiTrasporti.find(function(x) { return String(x.id) === String(id); });
            document.getElementById('sheet-patient-name').innerText = t.paziente + ' (' + t.regime + ')';
            document.getElementById('km-partenza-input').value = t.kmPartenza || '';
            document.getElementById('km-arrivo-input').value = t.kmArrivo || '';
            document.getElementById('chk-o2-somministrato').checked = false;
            document.getElementById('o2-details-row').style.display = 'none';
            fotoScontrinoBase64 = null;
            document.getElementById('overlay').classList.add('active');
            document.getElementById('bottomSheet').classList.add('active');
            setTimeout(initFirma, 300);
        };

        window.chiudiModaleBottomSheet = function() {
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('bottomSheet').classList.remove('active');
        };

        window.confermaChiusura = function() {
            const kmStart = parseFloat(document.getElementById('km-partenza-input').value) || 0;
            const kmEnd = parseFloat(document.getElementById('km-arrivo-input').value) || 0;
            if (kmEnd <= 0) { alert("Inserisci i KM di arrivo!"); return; }

            const o2Usato = document.getElementById('chk-o2-somministrato').checked;
            const updates = {
                kmPartenza: kmStart,
                kmArrivo: kmEnd,
                oraChiusura: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
                statoServizio: 'Da Rendicontare',
                ossigenoSomministrato: o2Usato,
                ossigenoLitriMin: o2Usato ? (document.getElementById('o2-litri').value || '4') : null,
                ossigenoMinuti: o2Usato ? (document.getElementById('o2-minuti').value || '20') : null
            };
            if (signatureCanvas && hasDrawn) updates.firma = signatureCanvas.toDataURL('image/png');
            if (fotoScontrinoBase64) updates.fotoScontrino = fotoScontrinoBase64;

            inviaOAccodaUpdate('trasporti/' + idServizioAttivo, updates);
            chiudiModaleBottomSheet();
            window.showToast("Servizio Archiviato & Rendicontato!");
        };

        function inviaOAccodaUpdate(path, dati) {
            if (navigator.onLine) {
                getDbRef(path).update(dati).catch(function() { accodaOffline(path, dati); });
            } else {
                accodaOffline(path, dati);
            }
        }

        function accodaOffline(path, dati) {
            let coda = JSON.parse(localStorage.getItem('cda_offline_queue') || '[]');
            coda.push({ path: path, dati: dati, timestamp: Date.now() });
            localStorage.setItem('cda_offline_queue', JSON.stringify(coda));
            window.showToast("Salvato in memoria locale (Offline).", true);
        }

        function sincronizzaCodaOffline() {
            let coda = JSON.parse(localStorage.getItem('cda_offline_queue') || '[]');
            if (coda.length > 0 && navigator.onLine) {
                coda.forEach(function(item) { getDbRef(item.path).update(item.dati); });
                localStorage.removeItem('cda_offline_queue');
                window.showToast("Dati offline sincronizzati sul Cloud!");
            }
        }
        window.addEventListener('online', sincronizzaCodaOffline);

        function aggiornaStatoPresenzaUI() {
            const oggi = new Date().toISOString().split('T')[0];
            const mie = presenze.filter(function(p) { return p.volontario === volontarioCorrente && p.data === oggi; }).sort(function(a,b) { return a.timestamp - b.timestamp; });
            const inServizio = mie.length > 0 && mie[mie.length - 1].tipo === 'ENTRATA';
            
            document.getElementById('dot-presenza').classList.toggle('attivo', inServizio);
            document.getElementById('val-stato-presenza').innerText = inServizio ? "In Servizio" : "Fuori Servizio";
            document.getElementById('btn-toggle-presenza').className = "btn-timbro " + (inServizio ? "esci" : "entra");
            document.getElementById('btn-toggle-presenza').innerHTML = inServizio ? '<i class="fa-solid fa-right-from-bracket"></i> Termina Turno' : '<i class="fa-solid fa-right-to-bracket"></i> Inizia Turno';
        }

        window.toggleTimbraturaPresenza = function() {
            const oggi = new Date().toISOString().split('T')[0];
            const mie = presenze.filter(function(p) { return p.volontario === volontarioCorrente && p.data === oggi; }).sort(function(a,b) { return a.timestamp - b.timestamp; });
            const inServizio = mie.length > 0 && mie[mie.length - 1].tipo === 'ENTRATA';
            const tipo = inServizio ? 'USCITA' : 'ENTRATA';

            const id = Date.now().toString();
            getDbRef('presenze/' + id).set({
                id: id, volontario: volontarioCorrente, tipo: tipo, data: oggi,
                ora: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            }).then(function() {
                window.showToast(tipo === 'ENTRATA' ? 'Buon Turno!' : 'Turno Concluso!');
                aggiornaStatoPresenzaUI();
            });
        };
    </script>
</body>
</html>
